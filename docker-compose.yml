services:
  # 1. PostgreSQL (Transactional DB for Users, Auth, Websites, Subscriptions)
  postgres:
    image: postgres:16-alpine
    container_name: analytika-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: analytika
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytika"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. pgAdmin 4 (Visual Web GUI for PostgreSQL Tables)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: analytika-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@analytika.dev
      PGADMIN_DEFAULT_PASSWORD: adminpassword
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # 3. ClickHouse (High-Speed OLAP Database for Analytics Events & Funnels)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: analytika-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: analytika
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhousepassword
    ports:
      - "8123:8123" # HTTP API (used by @clickhouse/client)
      - "9000:9000" # Native TCP client port
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  postgres_data:
  pgadmin_data:
  clickhouse_data:
