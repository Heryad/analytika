services:
  # 1. PostgreSQL (Transactional DB for Users, Auth, Websites, Subscriptions)
  postgres:
    image: postgres:16-alpine
    container_name: analytika-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-analytika}
    ports:
      # STRICT SECURITY: Bound ONLY to 127.0.0.1 (Loopback). Zero public internet exposure!
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-analytika}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. ClickHouse (High-Speed OLAP Database for Events, Maps, Funnels & MRR)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: analytika-clickhouse
    restart: always
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytika}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    ports:
      # STRICT SECURITY: Bound ONLY to 127.0.0.1 (Loopback). Zero public internet exposure!
      - "127.0.0.1:8123:8123" # HTTP API
      - "127.0.0.1:9000:9000" # Native TCP client
    volumes:
      - clickhouse_prod_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # 3. Fider — Open Source Feedback Board
  # Uses the same postgres instance but its own isolated 'fider' database
  fider:
    image: getfider/fider:stable
    container_name: analytika-fider
    restart: always
    ports:
      # Bound to loopback only — exposed via Caddy reverse proxy
      - "127.0.0.1:3010:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/fider?sslmode=disable
      JWT_SECRET: ${FIDER_JWT_SECRET:?FIDER_JWT_SECRET is required}
      EMAIL_NOREPLY: ${FIDER_EMAIL_NOREPLY:-noreply@analytika.me}
      EMAIL_SMTP_HOST: ${FIDER_SMTP_HOST:-smtp.resend.com}
      EMAIL_SMTP_PORT: ${FIDER_SMTP_PORT:-465}
      EMAIL_SMTP_USERNAME: ${FIDER_SMTP_USERNAME:-resend}
      EMAIL_SMTP_PASSWORD: ${FIDER_SMTP_PASSWORD:?FIDER_SMTP_PASSWORD is required}
      EMAIL_SMTP_ENABLE_STARTTLS: "false"
      BASE_URL: ${FIDER_BASE_URL:-https://feedback.analytika.me}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_prod_data:
  clickhouse_prod_data:
